<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLICE BOY - TOOLS PORTFOLIO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --mpc-body: #2b2b2b;
            --mpc-panel: #1f1f1f;
            --screen-bg: #0b1d1d;
            --screen-text: #00ffcc;
            --pad-bg: #383838;
            --pad-border: #4d4d4d;
            --pad-active: #ff9900;
            --accent: #ff9900;
        }

        body {
            background-color: #121212;
            color: #d0d0d0;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .mpc-unit {
            background-color: var(--mpc-body);
            width: 380px;
            padding: 25px 20px 30px 20px;
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.1);
            border-bottom: 6px solid #111;
            position: relative;
        }

        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
        }

        .knob {
            width: 26px;
            height: 26px;
            background: #151515;
            border: 2px solid #444;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 3px 5px rgba(0,0,0,0.5);
        }
        .knob::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 10px;
            width: 3px;
            height: 8px;
            background: var(--accent);
            border-radius: 2px;
        }

        .logo-area {
            text-align: center;
        }

        .brand {
            font-size: 13px;
            color: #fff;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .model {
            font-size: 6px;
            color: var(--accent);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .lcd-screen {
            background-color: var(--screen-bg);
            color: var(--screen-text);
            border: 2px solid #111;
            padding: 12px 10px;
            border-radius: 4px;
            text-align: center;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.8);
            margin-bottom: 20px;
            min-height: 75px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .lcd-title {
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .lcd-subtitle {
            font-size: 6px;
            line-height: 1.5;
            color: #88eedd;
        }

        /* MPCスタイル 16パッド（ポータル仕様） */
        .pad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background: var(--mpc-panel);
            padding: 10px;
            border-radius: 6px;
            border: 2px solid #151515;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .pad {
            background-color: var(--pad-bg);
            border: 2px solid var(--pad-border);
            border-radius: 4px;
            height: 52px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #aaa;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            box-shadow: 0 3px 0 #111, inset 0 1px 2px rgba(255,255,255,0.1);
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
            overflow: hidden;
        }

        /* 左上のパッド（SLICE BOY） */
        .pad.active-tool {
            background-color: #3d2414;
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 3px 0 #b36b00, inset 0 1px 2px rgba(255,153,0,0.3);
        }

        .pad.active-tool:hover {
            background-color: var(--accent);
            color: #121212;
        }

        .pad.active-tool:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b36b00;
        }

        .pad span {
            font-size: 8px;
            color: #666;
            margin-top: 3px;
        }

        .pad.active-tool span {
            color: #ffaa33;
        }
        .pad.active-tool:hover span {
            color: #121212;
        }

        .pad.coming-soon {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .meta-info {
            margin-top: 18px;
            font-size: 8px;
            text-align: center;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="mpc-unit">
        <div class="top-panel">
            <div class="knob"></div>
            <div class="logo-area">
         
                <div class="brand">MY FREKIN TOOL</div>
            </div>
            <div class="knob"></div>
        </div>

        <div class="lcd-screen">
            <div class="lcd-title">&gt;&gt; SELECT A TOOL &lt;&lt;</div>
           
        </div>

        <!-- 16パッド：左上（Pad 1）がリンク、他はCOMING SOON -->
        <div class="pad-grid">
            <!-- PAD 1: SLICE BOY (リンクあり) -->
            <a href="https://jogo-jpn.github.io/SLICE_BOY/" class="pad active-tool">
                PAD 1
                <span>SLICE BOY</span>
		<span>beta</span>
            </a>
            
            <!-- PAD 2〜16: Coming Soon -->
            <div class="pad coming-soon">PAD 2<span>SOON</span></div>
            <div class="pad coming-soon">PAD 3<span>SOON</span></div>
            <div class="pad coming-soon">PAD 4<span>SOON</span></div>
            
            <div class="pad coming-soon">PAD 5<span>SOON</span></div>
            <div class="pad coming-soon">PAD 6<span>SOON</span></div>
            <div class="pad coming-soon">PAD 7<span>SOON</span></div>
            <div class="pad coming-soon">PAD 8<span>SOON</span></div>
            
            <div class="pad coming-soon">PAD 9<span>SOON</span></div>
            <div class="pad coming-soon">PAD 10<span>SOON</span></div>
            <div class="pad coming-soon">PAD 11<span>SOON</span></div>
            <div class="pad coming-soon">PAD 12<span>SOON</span></div>
            
            <div class="pad coming-soon">PAD 13<span>SOON</span></div>
            <div class="pad coming-soon">PAD 14<span>SOON</span></div>
            <div class="pad coming-soon">PAD 15<span>SOON</span></div>
            <div class="pad coming-soon">PAD 16<span>SOON</span></div>
        </div>

        <div class="meta-info">
            STARTED IN 2026 / by jogo.jpn
        </div>
    </div>

</body>
</html>
